<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ChatW Pride Mascot Self-Chat Avatar">
  <defs>
    <clipPath id="cw-pride-circle">
      <circle cx="64" cy="64" r="64" />
    </clipPath>
    <linearGradient id="cw-mascot-body" x1="0.08" y1="0.02" x2="0.87" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="56%" stop-color="#F2F6FF" />
      <stop offset="100%" stop-color="#D4E3FF" />
    </linearGradient>
    <linearGradient id="cw-mascot-ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBCFE8" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
  </defs>

  <g clip-path="url(#cw-pride-circle)">
    <!-- Vibrant Bright 6-Stripe LGBTQ+ Pride Rainbow Flag Background (Spec 086) -->
    <rect x="0" y="0" width="128" height="21.8" fill="#FF2E55" />
    <rect x="0" y="21.3" width="128" height="21.8" fill="#FF8C1A" />
    <rect x="0" y="42.6" width="128" height="21.8" fill="#FFE119" />
    <rect x="0" y="64.0" width="128" height="21.8" fill="#00D166" />
    <rect x="0" y="85.3" width="128" height="21.8" fill="#1A8CFF" />
    <rect x="0" y="106.6" width="128" height="21.8" fill="#A838FF" />

    <!-- Optically centered (+1px right) Original ChatW Bubble-Spirit Mascot -->
    <g transform="translate(2.5, 0)">
      <!-- Soft drop shadow behind original ChatW Bubble-Spirit Mascot -->
      <g transform="translate(0, 4.6)" opacity="0.27">
        <path d="M 52 35.5 C 59 33.8 69 33.8 76 35.5 C 82.5 23.5 90.5 18.5 96 22 C 101 25.2 100.5 35.5 97.5 44.5 C 104.5 51.5 107.8 60.5 106.2 71.5 C 104.2 86.2 91.5 98 70.5 99.6 C 60 100.4 50.5 99.2 43.2 96.2 C 36.2 101.2 28.8 105.2 25 103.2 C 21.5 101.4 24.8 93.5 28.4 87 C 22.5 79.5 20.4 69.8 21.9 59.5 C 23.2 51.4 26.2 47 30.5 44.5 C 27.5 35.5 27 25.2 32 22 C 37.5 18.5 45.5 23.5 52 35.5 Z" fill="#0F172A" />
      </g>

      <!-- Original ChatW Bubble-Spirit Mascot Body (Smooth Speech-Bubble Silhouette + Soft Ears + Bottom-Left Tail) -->
      <path d="M 52 35.5 C 59 33.8 69 33.8 76 35.5 C 82.5 23.5 90.5 18.5 96 22 C 101 25.2 100.5 35.5 97.5 44.5 C 104.5 51.5 107.8 60.5 106.2 71.5 C 104.2 86.2 91.5 98 70.5 99.6 C 60 100.4 50.5 99.2 43.2 96.2 C 36.2 101.2 28.8 105.2 25 103.2 C 21.5 101.4 24.8 93.5 28.4 87 C 22.5 79.5 20.4 69.8 21.9 59.5 C 23.2 51.4 26.2 47 30.5 44.5 C 27.5 35.5 27 25.2 32 22 C 37.5 18.5 45.5 23.5 52 35.5 Z"
            fill="url(#cw-mascot-body)"
            stroke="#1E293B"
            stroke-width="3.4"
            stroke-linejoin="round" />

      <!-- Soft lower-right plump inner shading -->
      <path d="M 98.8 54 C 103.5 63.5 102.5 78 92 88.2 C 82.5 96.8 66 98.5 50.5 96.2 C 67 95.5 81.5 91.5 90 82.5 C 97.2 74.8 100 64.5 98.8 54 Z"
            fill="#BBD1FF"
            opacity="0.65" />

      <!-- Soft glossy top-left forehead highlight -->
      <ellipse cx="49" cy="43.8" rx="11.5" ry="4.4" transform="rotate(-14 49 43.8)" fill="#FFFFFF" opacity="0.92" />

      <!-- Pastel Pink Inner Ears -->
      <path d="M 35.2 27.6 C 32.8 30.2 33.6 36.6 37.2 39.2 C 41.2 37.8 44.8 34.0 44.0 30.8 C 42.2 27.8 38.0 26.2 35.2 27.6 Z"
            fill="url(#cw-mascot-ear)" />
      <path d="M 92.8 27.6 C 95.2 30.2 94.4 36.6 90.8 39.2 C 86.8 37.8 83.2 34.0 84.0 30.8 C 85.8 27.8 90.0 26.2 92.8 27.6 Z"
            fill="url(#cw-mascot-ear)" />

      <!-- Glossy Deep-Slate Kawaii Eyes with Dual Catchlights -->
      <ellipse cx="48.5" cy="63.8" rx="5.2" ry="6.2" fill="#1E293B" />
      <circle cx="46.8" cy="61.4" r="2.1" fill="#FFFFFF" />
      <circle cx="50.4" cy="66.4" r="1.0" fill="#FFFFFF" opacity="0.9" />

      <ellipse cx="79.5" cy="63.8" rx="5.2" ry="6.2" fill="#1E293B" />
      <circle cx="77.8" cy="61.4" r="2.1" fill="#FFFFFF" />
      <circle cx="81.4" cy="66.4" r="1.0" fill="#FFFFFF" opacity="0.9" />

      <!-- Soft Rosy Blush Cheeks -->
      <ellipse cx="37.2" cy="73.2" rx="5.8" ry="3.4" fill="#FB7185" opacity="0.54" />
      <ellipse cx="90.8" cy="73.2" rx="5.8" ry="3.4" fill="#FB7185" opacity="0.54" />

      <!-- Playful Cat-Spirit Happy Smile -->
      <path d="M 56.5 72.0 Q 60.2 76.8 64 72.8 Q 67.8 76.8 71.5 72.0"
            fill="none"
            stroke="#1E293B"
            stroke-width="3.0"
            stroke-linecap="round"
            stroke-linejoin="round" />
    </g>
  </g>
</svg>
