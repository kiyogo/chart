<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><style>.bob{animation:bob 1.8s ease-in-out infinite;transform-origin:128px 220px}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.wave{animation:wave 1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}.beat{animation:beat 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}.rise{animation:rise 2.4s ease-in infinite}@keyframes rise{0%{transform:translateY(10px);opacity:0}30%{opacity:1}100%{transform:translateY(-30px);opacity:0}}.tw{animation:tw 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.5}}.pop{animation:pop 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pop{0%,100%{transform:scale(1)}40%{transform:scale(1.12)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}.zz{animation:zz 2.4s ease-in-out infinite}@keyframes zz{0%{transform:translate(0,8px);opacity:0}40%{opacity:1}100%{transform:translate(8px,-10px);opacity:0}}.fall{animation:fall 2s linear infinite}@keyframes fall{0%{transform:translateY(-10px)}100%{transform:translateY(24px)}}.d1{animation-delay:.35s}.d2{animation-delay:.7s}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g class="bob"><circle cx="80" cy="146" r="52" fill="#EAF3FF"/><circle cx="128" cy="112" r="64" fill="#EAF3FF"/><circle cx="182" cy="142" r="54" fill="#EAF3FF"/><rect x="34" y="138" width="190" height="64" rx="32" fill="#EAF3FF"/><ellipse cx="104" cy="88" rx="22" ry="10" fill="#fff" opacity=".6"/><ellipse cx="128" cy="186" rx="76" ry="14" fill="#B9D4F5" opacity=".4"/><ellipse cx="72" cy="158" rx="16" ry="8" 