<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><style>.bob{animation:bob 1.8s ease-in-out infinite;transform-origin:128px 220px}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.wave{animation:wave 1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}.beat{animation:beat 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}.rise{animation:rise 2.4s ease-in infinite}@keyframes rise{0%{transform:translateY(10px);opacity:0}30%{opacity:1}100%{transform:translateY(-30px);opacity:0}}.tw{animation:tw 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.5}}.pop{animation:pop 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pop{0%,100%{transform:scale(1)}40%{transform:scale(1.12)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}.zz{animation:zz 2.4s ease-in-out infinite}@keyframes zz{0%{transform:translate(0,8px);opacity:0}40%{opacity:1}100%{transform:translate(8px,-10px);opacity:0}}.fall{animation:fall 2s linear infinite}@keyframes fall{0%{transform:translateY(-10px)}100%{transform:translateY(24px)}}.d1{animation-delay:.35s}.d2{animation-delay:.7s}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g class="bob"><path d="M118 52q10-26 18-4q12-20 14 6" stroke="#FFB627" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="128" cy="140" r="92" fill="#FFD84D"/><ellipse cx="128" cy="166" rx="70" ry="44" fill="#FFB627" opacity=".3"/><path d="M40 150q-14 6-10 22q14-4 22-14z" fill="#FFB627"/><path d="M216 150q14 6 10 22q-14-4-22-14z" fill="#FFB627"/><ellipse cx="72" cy="152" rx="13" ry="8" fill="#FF8FA3" opacity=".55"/><ellipse cx="184" cy="152" rx="13" ry="8" fill="#FF8FA3" opacity=".55"/><ellipse cx="98" cy="130" rx="9" ry="10" fill="#2B2A3D"/><ellipse cx="158" cy="130" rx="9" ry="10" fill="#2B2A3D"/><path d="M84 106L110 118M172 106L146 118" stroke="#2B2A3D" stroke-width="6" stroke-linecap="round"/><path d="M114 158L128 150L142 158L128 168Z" fill="#FF8A3D"/></g><ellipse cx="128" cy="108" rx="70" ry="22" fill="#FF5A5A" opacity=".22"/><path class="beat" d="M196 52l10 10M216 52l-10 10M196 72l10-10M216 72l-10-10" stroke="#FF3B3B" stroke-width="7" stroke-linecap="round"/><text class="pop" x="70" y="56" font-family="Nunito, 'Arial Rounded MT Bold', 'Segoe UI', Verdana, sans-serif" font-weight="900" font-size="30" text-anchor="middle" fill="#FF8080" stroke="#2B2A3D" stroke-width="7" stroke-linejoin="round" paint-order="stroke">Hmph</text></svg>