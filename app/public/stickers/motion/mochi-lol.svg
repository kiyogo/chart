<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><style>.bob{animation:bob 1.8s ease-in-out infinite;transform-origin:128px 220px}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.wave{animation:wave 1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}.beat{animation:beat 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}.rise{animation:rise 2.4s ease-in infinite}@keyframes rise{0%{transform:translateY(10px);opacity:0}30%{opacity:1}100%{transform:translateY(-30px);opacity:0}}.tw{animation:tw 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.5}}.pop{animation:pop 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pop{0%,100%{transform:scale(1)}40%{transform:scale(1.12)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}.zz{animation:zz 2.4s ease-in-out infinite}@keyframes zz{0%{transform:translate(0,8px);opacity:0}40%{opacity:1}100%{transform:translate(8px,-10px);opacity:0}}.fall{animation:fall 2s linear infinite}@keyframes fall{0%{transform:translateY(-10px)}100%{transform:translateY(24px)}}.d1{animation-delay:.35s}.d2{animation-delay:.7s}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g class="bob"><path d="M58 104L70 40Q74 30 84 36L122 66Z" fill="#FFE1BF"/><path d="M198 104L186 40Q182 30 172 36L134 66Z" fill="#FFE1BF"/><path d="M70 86L78 50L104 70Z" fill="#FFA8B8"/><path d="M186 86L178 50L152 70Z" fill="#FFA8B8"/><ellipse cx="128" cy="138" rx="94" ry="80" fill="#FFE1BF"/><ellipse cx="128" cy="150" rx="78" ry="58" fill="#F6B98A" opacity=".35"/><path d="M44 150h28M46 166l26-6M212 150h-28M210 166l-26-6" stroke="#2B2A3D" stroke-width="3" stroke-linecap="round" opacity=".45"/><ellipse cx="72" cy="152" rx="13" ry="8" fill="#FF8FA3" opacity=".55"/><ellipse cx="184" cy="152" rx="13" ry="8" fill="#FF8FA3" opacity=".55"/><path d="M86 132Q98 116 110 132" stroke="#2B2A3D" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M146 132Q158 116 170 132" stroke="#2B2A3D" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M104 156Q128 198 152 156Z" fill="#2B2A3D" stroke="#2B2A3D" stroke-width="4" stroke-linejoin="round"/><ellipse cx="128" cy="172" rx="12" ry="7" fill="#FF7A90"/></g><path d="M78 134q-8 14 0 20q8-6 0-20z" fill="#6EC6FF"/><path d="M178 134q-8 14 0 20q8-6 0-20z" fill="#6EC6FF"/><text class="pop" x="128" y="52" font-family="Nunito, 'Arial Rounded MT Bold', 'Segoe UI', Verdana, sans-serif" font-weight="900" font-size="40" text-anchor="middle" fill="#FFD23F" stroke="#2B2A3D" stroke-width="7" stroke-linejoin="round" paint-order="stroke">LOL</text></svg>