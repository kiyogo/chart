<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><style>.bob{animation:bob 1.8s ease-in-out infinite;transform-origin:128px 220px}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.wave{animation:wave 1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}.beat{animation:beat 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}.rise{animation:rise 2.4s ease-in infinite}@keyframes rise{0%{transform:translateY(10px);opacity:0}30%{opacity:1}100%{transform:translateY(-30px);opacity:0}}.tw{animation:tw 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.5}}.pop{animation:pop 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pop{0%,100%{transform:scale(1)}40%{transform:scale(1.12)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}.zz{animation:zz 2.4s ease-in-out infinite}@keyframes zz{0%{transform:translate(0,8px);opacity:0}40%{opacity:1}100%{transform:translate(8px,-10px);opacity:0}}.fall{animation:fall 2s linear infinite}@keyframes fall{0%{transform:translateY(-10px)}100%{transform:translateY(24px)}}.d1{animation-delay:.35s}.d2{animation-delay:.7s}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g class="bob"><path d="M118 52q10-26 18-4q12-20 14 6" stroke="#FFB627" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="128" cy="140" r="92" fill="#FFD84D"/><ellipse cx="128" cy="166" rx="70" ry="44" fill="#FFB627" opacity=".3"/><path d="M40 150q-14 6-10 22q14-4 22-14z" fill="#FFB627"/><path d="M216 150q14 6 10 22q-14-4-22-14z" fill="#FFB627"/><ellipse cx="72" cy="152" rx="13" ry="8" fill="#FF8FA3" opacity=".55"/><ellipse cx="184" cy="152" rx="13" ry="8" fill="#FF8FA3" opacity=".55"/><path d="M86 132Q98 116 110 132" stroke="#2B2A3D" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M146 132Q158 116 170 132" stroke="#2B2A3D" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M114 156L128 148L142 156Z" fill="#FF8A3D"/><path d="M116 162L128 176L140 162Z" fill="#E86A1F"/></g><g class="wave"><circle cx="40" cy="86" r="20" fill="#FFD84D" stroke="#2B2A3D" stroke-width="4"/><path d="M33 80v7M40 78v8M47 80v7" stroke="#2B2A3D" stroke-width="3" stroke-linecap="round" opacity=".5"/></g><g class="wave d1"><circle cx="216" cy="86" r="20" fill="#FFD84D" stroke="#2B2A3D" stroke-width="4"/><path d="M209 80v7M216 78v8M223 80v7" stroke="#2B2A3D" stroke-width="3" stroke-linecap="round" opacity=".5"/></g><path class="tw" d="M128 22Q130.16 31.84 140 34Q130.16 36.16 128 46Q125.84 36.16 116 34Q125.84 31.84 128 22z" fill="#FFD23F"/><path class="tw d1" d="M70 32Q71.44 38.56 78 40Q71.44 41.44 70 48Q68.56 41.44 62 40Q68.56 38.56 70 32z" fill="#FFD23F"/><path class="tw d2" d="M186 32Q187.44 38.56 194 40Q187.44 41.44 186 48Q184.56 41.44 178 40Q184.56 38.56 186 32z" fill="#FFD23F"/><text class="pop" x="128" y="244" font-family="Nunito, 'Arial Rounded MT Bold', 'Segoe UI', Verdana, sans-serif" font-weight="900" font-size="34" text-anchor="middle" fill="#FFD23F" stroke="#2B2A3D" stroke-width="7" stroke-linejoin="round" paint-order="stroke">Yay!</text></svg>