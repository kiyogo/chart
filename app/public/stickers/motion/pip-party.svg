<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><style>.bob{animation:bob 1.8s ease-in-out infinite;transform-origin:128px 220px}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.wave{animation:wave 1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}.beat{animation:beat 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}.rise{animation:rise 2.4s ease-in infinite}@keyframes rise{0%{transform:translateY(10px);opacity:0}30%{opacity:1}100%{transform:translateY(-30px);opacity:0}}.tw{animation:tw 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.5}}.pop{animation:pop 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pop{0%,100%{transform:scale(1)}40%{transform:scale(1.12)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}.zz{animation:zz 2.4s ease-in-out infinite}@keyframes zz{0%{transform:translate(0,8px);opacity:0}40%{opacity:1}100%{transform:translate(8px,-10px);opacity:0}}.fall{animation:fall 2s linear infinite}@keyframes fall{0%{transform:translateY(-10px)}100%{transform:translateY(24px)}}.d1{animation-delay:.35s}.d2{animation-delay:.7s}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g class="bob"><path d="M118 52q10-26 18-4q12-20 14 6" stroke="#FFB627" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="128" cy="140" r="92" fill="#FFD84D"/><ellipse cx="128" cy="166" rx="70" ry="44" fill="#FFB627" opacity=".3"/><path d="M40 150q-14 6-10 22q14-4 22-14z" fill="#FFB627"/><path d="M216 150q14 6 10 22q-14-4-22-14z" fill="#FFB627"/><ellipse cx="72" cy="152" rx="13" ry="8" fill="#FF8FA3" opacity=".55"/><ellipse cx="184" cy="152" rx="13" ry="8" fill="#FF8FA3" opacity=".55"/><path d="M86 132Q98 116 110 132" stroke="#2B2A3D" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M146 132Q158 116 170 132" stroke="#2B2A3D" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M114 156L128 148L142 156Z" fill="#FF8A3D"/><path d="M116 162L128 176L140 162Z" fill="#E86A1F"/></g><g class="fall d0"><rect x="40" y="40" width="10" height="16" rx="3" fill="#FF4D6D" transform="rotate(20 40 40)"/></g><g class="fall d1"><rect x="70" y="20" width="10" height="16" rx="3" fill="#FFD23F" transform="rotate(-30 70 20)"/></g><g class="fall d2"><rect x="190" y="30" width="10" height="16" rx="3" fill="#4F7BFF" transform="rotate(40 190 30)"/></g><g class="fall d0"><rect x="220" y="70" width="10" height="16" rx="3" fill="#3DDC97" transform="rotate(-20 220 70)"/></g><g class="fall d1"><rect x="30" y="100" width="10" height="16" rx="3" fill="#B388FF" transform="rotate(10 30 100)"/></g><g class="fall d2"><rect x="226" y="120" width="10" height="16" rx="3" fill="#FF8A3D" transform="rotate(30 226 120)"/></g><path d="M78 66L110 8L132 62Z" fill="#4F7BFF"/><path d="M90 44l26 6M84 56l36 6" stroke="#FFD23F" stroke-width="6"/><circle cx="110" cy="8" r="8" fill="#FF4D6D"/></svg>