<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><style>.f{animation:f 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes f{0%{transform:scale(.1);opacity:1}80%{opacity:1}100%{transform:scale(1.3);opacity:0}}.d1{animation-delay:.6s}.d2{animation-delay:1.2s}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="256" height="256" rx="40" fill="#141B33"/><g transform="translate(80 90)"><circle r="40" fill="none" stroke="#FFD23F" stroke-width="6" stroke-dasharray="4 14" class="f d0"/><circle r="6" fill="#FFD23F" class="f d0"/></g><g transform="translate(176 110)"><circle r="40" fill="none" stroke="#FF4D6D" stroke-width="6" stroke-dasharray="4 14" class="f d1"/><circle r="6" fill="#FF4D6D" class="f d1"/></g><g transform="translate(120 180)"><circle r="40" fill="none" stroke="#6EC6FF" stroke-width="6" stroke-dasharray="4 14" class="f d2"/><circle r="6" fill="#6EC6FF" class="f d2"/></g></svg>