<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><style>.g{animation:g 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes g{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.85}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><text class="g" x="128" y="150" font-family="Nunito, 'Arial Rounded MT Bold', 'Segoe UI', Verdana, sans-serif" font-weight="900" font-size="110" text-anchor="middle" fill="#3DDC97" stroke="#2B2A3D" stroke-width="7" stroke-linejoin="round" paint-order="stroke">GG</text></svg>