<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><style>.p{animation:p 1s cubic-bezier(.3,1.6,.5,1) infinite;transform-box:fill-box;transform-origin:center}@keyframes p{0%{transform:scale(.6)}40%{transform:scale(1.15)}100%{transform:scale(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><text class="p" x="128" y="150" font-family="Nunito, 'Arial Rounded MT Bold', 'Segoe UI', Verdana, sans-serif" font-weight="900" font-size="120" text-anchor="middle" fill="#4F7BFF" stroke="#2B2A3D" stroke-width="7" stroke-linejoin="round" paint-order="stroke">+1</text></svg>