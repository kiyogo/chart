# Development PostgreSQL only. Do not use these credentials in production.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chatw
      POSTGRES_PASSWORD: chatw_dev_password
      POSTGRES_DB: chatw
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatw -d chatw"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
