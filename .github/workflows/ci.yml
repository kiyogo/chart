name: CI / Multi-Platform Build & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-backend:
    name: Backend Tests (Axum + SQLx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Backend Tests
        run: cargo test -p chatw --lib

  build-web:
    name: Web Client (WASM + wasm-bindgen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.130 || true
      - name: Build Web Bundle
        run: |
          chmod +x app/build-web.sh
          ./app/build-web.sh release
      - name: Verify Artifacts
        run: ls -lh app/dist/pkg/chatw_app_bg.wasm

  build-desktop-linux:
    name: Desktop Linux (WebKitGTK + GTK3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libxdo-dev pkg-config
      - name: Build Linux Desktop
        run: cargo build -p chatw-app --features desktop --release
      - name: Package Debian (.deb)
        run: |
          chmod +x app/package-deb.sh
          ./app/package-deb.sh
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatw-linux-deb
          path: target/chatw_0.1.0_amd64.deb

  build-desktop-windows:
    name: Desktop Windows (WebView2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows Desktop
        run: cargo build -p chatw-app --features desktop --release
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatw-windows-exe
          path: target/release/chatw-app.exe

  build-desktop-macos:
    name: Desktop macOS (WebKit)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build macOS Desktop
        run: cargo build -p chatw-app --features desktop --release
      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatw-macos-bin
          path: target/release/chatw-app

