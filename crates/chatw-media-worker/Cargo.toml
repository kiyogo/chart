[package]
name = "chatw-media-worker"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
blake3 = "1.8"
chatw-media-core = { path = "../chatw-media-core", default-features = false, features = ["avif-codec", "lossless-files"] }
chatw-msg-store = { path = "../chatw-msg-store", default-features = false, features = ["pure-zstd"] }
wasm-bindgen = "0.2.130"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
