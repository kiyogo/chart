[package]
name = "chatw"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.12"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "migrate", "macros"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower = "0.5.3"
tower-http = { version = "0.6", features = ["fs", "timeout", "set-header", "trace", "request-id", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.26"
urlencoding = "2.1.3"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "cookies"] }
tokio-tungstenite = "0.30.0"
