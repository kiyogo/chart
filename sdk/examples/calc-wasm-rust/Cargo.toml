[package]
name = "calc-wasm-rust"
version = "1.0.0"
edition = "2021"
description = "Real Rust-to-WASM third-party ChatW Plugin"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
chatw-plugin-sdk = { path = "../../rust" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
