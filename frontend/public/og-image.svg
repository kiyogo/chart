<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F19" />
      <stop offset="0.5" stop-color="#0F172A" />
      <stop offset="1" stop-color="#1E1B4B" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="600" cy="200" r="350" fill="url(#glow)" />

  <!-- Logo Group -->
  <g transform="translate(540, 90)">
    <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
    </svg>
  </g>

  <!-- Typography -->
  <text x="600" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">chatw</text>
  
  <text x="600" y="355" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="500" fill="#94A3B8">Ứng dụng nhắn tin bảo mật mã hóa đầu cuối (E2EE)</text>

  <!-- Security Badges -->
  <g transform="translate(180, 430)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="250" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="125" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38BDF8">ECDH P-256 / AES-256</text>

    <!-- Badge 2 -->
    <rect x="270" y="0" width="180" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="360" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#34D399">ECDSA P-256</text>

    <!-- Badge 3 -->
    <rect x="470" y="0" width="190" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="565" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#A78BFA">Zero-Knowledge</text>

    <!-- Badge 4 -->
    <rect x="680" y="0" width="160" height="48" rx="24" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="760" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F472B6">SolidJS + Rust</text>
  </g>

  <!-- Bottom status note -->
  <text x="600" y="550" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#64748B">Bảo vệ quyền riêng tư tuyệt đối • Khóa mật mã lưu cục bộ trên thiết bị</text>
</svg>
